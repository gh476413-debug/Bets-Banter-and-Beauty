  var styleEl = document.getElementById('app-css');

  var ACCESS_FILE = 'access.json';

  // Three ways this page can keep score:
  //   artifact - running inside claude.ai, saves a new version of itself
  //   cloud    - hosted anywhere, syncs through a shared board code
  //   local    - hosted anywhere, saves in this browser only
  var localMode = !(window.claude && typeof window.claude.use === 'function');
  var gh = { owner: '', repo: '', branch: 'main', token: '' };
  try{
    var savedGh = JSON.parse(window.localStorage.getItem(GH_KEY) || 'null');
    if(savedGh && savedGh.owner) gh = savedGh;
  }catch(err){}
  if(!gh.owner){
    var found = detectRepo();
    if(found){ gh.owner = found.owner; gh.repo = found.repo; }
  }
  if(!gh.branch) gh.branch = 'main';
  var boardSha = '';
  var boardEtag = '';
  var needsSetup = false;
  // Running from the repo means the repo is the board. Inside Claude the page
  // saves itself and cannot call out at all, so it keeps its own tally.
  var mode = (localMode && gh.owner && gh.repo) ? 'cloud' : (localMode ? 'local' : 'artifact');
  var syncErr = '';
  var lastRemote = '';
  var poller = null;
  var STATE = JSON.parse(document.getElementById('state').textContent);

  function restoreLocal(){
    try{
      var saved = window.localStorage.getItem(LS_KEY);
      if(saved){ STATE = JSON.parse(saved); if(!STATE.bets) STATE.bets = []; }
    }catch(err){ /* private window, blocked storage: keep the baked-in state */ }
  }

  if(localMode) restoreLocal();
  if(!STATE.bets) STATE.bets = [];
  function mirrorLocal(){
    try{ window.localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(err){}
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function safeJson(o){ return JSON.stringify(o).replace(/</g,'\\u003c'); }

  function tally(){
    var t = {a:{total:0}, b:{total:0}, t:{total:0}, led:{a:0,b:0}};
    STATE.games.forEach(function(g){ t.a[g.id]=0; t.b[g.id]=0; t.t[g.id]=0; });
    STATE.log.forEach(function(e){
      var w = t[e.winner];
      if(w && typeof w[e.game] === 'number'){ w[e.game]++; w.total++; }
    });
    STATE.games.forEach(function(g){
      if(t.a[g.id] > t.b[g.id]) t.led.a++;
      else if(t.b[g.id] > t.a[g.id]) t.led.b++;
    });
    return t;
  }

  function sideName(k){
    return k === 't' ? (STATE.players.a + ' and ' + STATE.players.b) : STATE.players[k];
  }

  // "Cassie took Chess" / "Chess ended level"
  function outcomeLine(e){
    if(e.winner === 't'){
      return '<span class="w t">Tied</span><span class="g">at ' + esc(gameName(e.game)) + '</span>';
    }
    return '<span class="w ' + e.winner + '">' + esc(STATE.players[e.winner]) + '</span>'
      + '<span class="g">took ' + esc(gameName(e.game)) + '</span>';
  }

  function tiesOn(id){
    for(var i = 0; i < STATE.games.length; i++) if(STATE.games[i].id === id) return !!STATE.games[i].ties;
    return false;
  }

  function gameName(id){
    for(var i=0;i<STATE.games.length;i++) if(STATE.games[i].id===id) return STATE.games[i].name;
    return id;
  }

  function when(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '';
    var opts = {month:'short', day:'numeric'};
    if(d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  function clock(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '';
    if(hour24){
      // h23 keeps midnight at 00:00 instead of the 24:00 some locales hand back.
      try{ return d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', hour12:false, hourCycle:'h23'}); }
      catch(err){ return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    }
    return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit', hour12:true});
  }

  function toDateInput(iso){
    var d = new Date(iso); if(isNaN(d)) d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function toTimeInput(iso){
    var d = new Date(iso); if(isNaN(d)) return '';
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function fromParts(dv, tv, iso){
    var old = new Date(iso); if(isNaN(old)) old = new Date();
    var p = String(dv || '').split('-');
    var y = p.length === 3 ? +p[0] : old.getFullYear();
    var mo = p.length === 3 ? +p[1] - 1 : old.getMonth();
    var da = p.length === 3 ? +p[2] : old.getDate();
    var q = String(tv || '').split(':');
    var h = q.length >= 2 ? +q[0] : old.getHours();
    var mi = q.length >= 2 ? +q[1] : old.getMinutes();
    var nd = new Date(y, mo, da, h, mi, 0);
    return isNaN(nd) ? iso : nd.toISOString();
  }

  function places(){
    var seen = {}, out = [];
    STATE.log.forEach(function(e){ if(e.loc && !seen[e.loc]){ seen[e.loc] = 1; out.push(e.loc); } });
    return out.slice(0, 24);
  }

  function verdict(t){
    var A = STATE.players.a, B = STATE.players.b, n = STATE.log.length;
    if(n === 0) return 'No matches logged yet. Tap a name below the moment a game ends.';
    var lead = Math.abs(t.a.total - t.b.total);
    var who = t.a.total > t.b.total ? A : B;
    var head = lead === 0
      ? '<b>All square</b> at ' + t.a.total + '&ndash;' + t.b.total + '.'
      : '<b>' + esc(who) + '</b> leads by ' + lead + '.';
    var G = STATE.games.length, ledTxt;
    if(t.led.a > t.led.b) ledTxt = esc(A) + ' is ahead in ' + t.led.a + ' of ' + G + ' games';
    else if(t.led.b > t.led.a) ledTxt = esc(B) + ' is ahead in ' + t.led.b + ' of ' + G + ' games';
    else ledTxt = 'Games split ' + t.led.a + '&ndash;' + t.led.b + ' with ' + (G - t.led.a - t.led.b) + ' still tied';
    var tied = t.t.total ? ' (' + t.t.total + ' tie' + (t.t.total === 1 ? '' : 's') + ')' : '';
    return head + ' ' + ledTxt + ' across ' + n + ' match' + (n===1?'':'es') + tied + '.';
  }

  function card(g, t){
    var ca = t.a[g.id], cb = t.b[g.id], ct = t.t[g.id] || 0, tot = ca + cb + ct;
    var bar = tot === 0
      ? '<div class="bar empty"></div>'
      : '<div class="bar"><i class="a" style="flex:' + ca + '"></i>'
        + (ct ? '<i class="t" style="flex:' + ct + '"></i>' : '')
        + '<i class="b" style="flex:' + cb + '"></i></div>';
    function side(k, count, other){
      var lead = count > other ? ' lead' : '';
      var pop = (popKey === g.id + ':' + k) ? ' pop' : '';
      return '<button class="tap ' + k + lead + pop + '" id="tap-' + g.id + '-' + k + '" data-game="' + g.id + '" data-w="' + k + '"'
        + (readOnly ? ' disabled' : '')
        + ' aria-label="Log a ' + esc(g.name) + ' win for ' + esc(STATE.players[k]) + '">'
        + '<span class="n">' + count + '</span>'
        + '<span class="who">' + esc(STATE.players[k]) + '</span>'
        + (readOnly ? '' : '<span class="add">+ add win</span>')
        + '</button>';
    }
    var menu = readOnly ? ''
      : '<button class="dots" data-menu="' + g.id + '" title="' + esc(g.name) + ' options"'
        + ' aria-label="Options for ' + esc(g.name) + '">' + IC_DOTS + '</button>';
    var right = '<div class="ghr">' + (g.rule ? '<p class="rule">' + esc(g.rule) + '</p>' : '') + menu + '</div>';
    return '<article class="game">'
      + '<div class="gh"><h2>' + esc(g.name) + '</h2>' + right + '</div>'
      + bar
      + '<div class="sides">' + side('a', ca, cb) + side('b', cb, ca) + '</div>'
      + (ct ? '<p class="tieline">' + ct + ' tie' + (ct === 1 ? '' : 's') + '</p>' : '')
      + '</article>';
  }

    return '<form class="addform" id="add-form">'
      + '<div><label for="add-name">Game</label>'
      + '<input id="add-name" name="add-name" type="text" autocomplete="off" placeholder="Shuffleboard" maxlength="28" required></div>'
      + '<div><label for="add-rule">Tagline (optional)</label>'
      + '<input id="add-rule" name="add-rule" type="text" autocomplete="off" placeholder="Something to talk trash about" maxlength="52"></div>'
      + '<div class="acts"><button type="submit" class="btn primary" data-do-add="1">Add game</button>'
      + '<button type="button" class="btn" data-cancel-add="1">Cancel</button></div>'
      + '</form>';
  }

  function slug(name){
    var s = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'game';
    var taken = {}, i;
    for(i = 0; i < STATE.games.length; i++) taken[STATE.games[i].id] = 1;
    if(!taken[s]) return s;
    var n = 2; while(taken[s + '-' + n]) n++;
    return s + '-' + n;
  }

  // Flagged when nothing has been recorded yet: no bet and no deliberate
  // "no bet" mark, or a bet with nobody named as the one who called it.
  function needsInitiator(entry){
    var b = betFor(entry.id);
    if(!b) return !entry.nobet;
    return b.by !== 'a' && b.by !== 'b';
  }

  function ledgerHead(n){
    return '<div class="lhead">'
      + '<button class="lhtoggle" data-ledger-toggle="1" aria-expanded="' + (ledgerOpen ? 'true' : 'false') + '">'
      + '<span class="chev">&#9660;</span>Match ledger' + (n ? '<span class="cnt">' + n + '</span>' : '') + '</button>'
      + (ledgerOpen && n ? '<div class="sorts">'
          + '<button class="sortbtn" data-sort="date" aria-pressed="' + (ledgerSort === 'date') + '">Date</button>'
          + '<button class="sortbtn" data-sort="game" aria-pressed="' + (ledgerSort === 'game') + '">Game</button>'
          + '</div>' : '')
      + '</div>';
  }

  function ledger(){
    if(!STATE.log.length){
      return '<section class="ledger">' + ledgerHead(0)
        + (ledgerOpen ? '<p class="empty-note">Nothing here yet &mdash; the first win goes down in history.</p>' : '')
        + '</section>';
    }
    if(!ledgerOpen) return '<section class="ledger">' + ledgerHead(STATE.log.length) + '</section>';

    var log = STATE.log.slice();
    if(ledgerSort === 'game'){
      log.sort(function(x, y){
        var c = String(gameName(x.game)).localeCompare(String(gameName(y.game)));
        return c !== 0 ? c : (new Date(y.t) - new Date(x.t));
      });
    } else {
      // Sorted off the timestamps themselves, so a time added after the fact
      // drops the match straight into its right place in the run of play.
      log.sort(function(x, y){ return new Date(y.t) - new Date(x.t); });
    }
    var shown = showAll ? log : log.slice(0, 12);
    var rows = shown.map(function(e){
      var bits = [];
      if(!e.nodate) bits.push('<span class="when">' + when(e.t) + '</span>');
      if(!e.notime) bits.push('<span class="when">' + clock(e.t) + '</span>');
      if(e.loc) bits.push('<span class="place">' + esc(e.loc) + '</span>');
      var tags = [];
      var b = betFor(e.id);
      if(b) tags.push('<span class="betmark ' + (b.done ? 'done' : 'open') + '">' + (b.done ? 'bet settled' : 'bet open') + '</span>');
      else if(e.nobet) tags.push('<span class="nobetmark">no bet</span>');
      if(needsInitiator(e)) tags.push('<span class="needby">Bet initiator?</span>');
      if(!bits.length && !tags.length && !readOnly) bits.push('<span class="place">no details noted</span>');
      var meta = bits.join('<span class="sep">&middot;</span>') + tags.join('');
      return '<li><span class="chip ' + e.winner + '"></span>'
        + '<div class="rowmain">'
        + '<div class="l1">' + outcomeLine(e) + '</div>'
        + (meta ? '<div class="l2">' + meta + '</div>' : '')
        + '</div>'
        + (e.photo ? '<img class="thumb" src="' + esc(e.photo) + '" alt="Photo from this match" data-photo="' + e.id + '">' : '')
        + (readOnly ? '' : '<div class="rowacts">'
            + '<button class="undo" data-edit="' + e.id + '" aria-label="Edit this match">Edit</button>'
            + '<button class="undo" data-undo="' + e.id + '" aria-label="Delete this match">Delete</button></div>')
        + '</li>';
    }).join('');
    var more = (!showAll && log.length > 12)
      ? '<p class="more"><button class="undo" data-showall="1">Show all ' + log.length + '</button></p>' : '';
    return '<section class="ledger">' + ledgerHead(STATE.log.length)
      + '<p class="sub">' + (ledgerSort === 'game' ? 'Grouped by game, newest first within each.' : 'Newest first.')
      + ' Edit reopens the details sheet; Delete removes a match for good.</p>'
      + '<ul class="rows">' + rows + '</ul>' + more + '</section>';
  }

  function gamesSorted(){
    return STATE.games.slice().sort(function(x, y){ return String(x.name).localeCompare(String(y.name)); });
  }

  // Bets logged before the game was played: no match, not yet settled.
  function pendingBets(){
    return STATE.bets.filter(function(b){ return !b.matchId && !b.done; });
  }

  function attachBet(betId, matchId){
    var m = null, i;
    for(i = 0; i < STATE.log.length; i++) if(STATE.log[i].id === matchId) m = STATE.log[i];
    STATE.bets.forEach(function(b){
      if(b.id !== betId) return;
      b.matchId = matchId;
      // The result decides who pays; a tie leaves it open for the two of them to sort out.
      if(m && m.winner !== 't') b.owedBy = m.winner === 'a' ? 'b' : 'a';
    });
    if(m) delete m.nobet;
  }

  function betFor(matchId){
    for(var i = 0; i < STATE.bets.length; i++) if(STATE.bets[i].matchId === matchId) return STATE.bets[i];
    return null;
  }

  function matchLabel(id){
    for(var i = 0; i < STATE.log.length; i++){
      if(STATE.log[i].id === id){
        var e = STATE.log[i];
        return gameName(e.game) + ', ' + when(e.t);
      }
    }
    return '';
  }

  // A bet belongs to the night its game was played, not to the minute somebody
  // got around to typing it in. Only a bet with no match falls back to that.
  function betWhen(b){
    if(b.matchId){
      for(var i = 0; i < STATE.log.length; i++) if(STATE.log[i].id === b.matchId) return STATE.log[i].t;
    }
    return b.t;
  }

  function lastInitiated(){
    var called = STATE.bets.filter(function(b){ return b.by === 'a' || b.by === 'b'; })
                           .slice().sort(function(x, y){
                             var d = new Date(betWhen(x)) - new Date(betWhen(y));
                             return d !== 0 ? d : (new Date(x.t) - new Date(y.t));
                           });
    return called.length ? called[called.length - 1] : null;
  }

  // Whoever did NOT call the last bet is on the hook for the next one,
  // unless someone has appointed a person by hand until the next bet lands.
  function autoInitiator(){
    var last = lastInitiated();
    return last ? (last.by === 'a' ? 'b' : 'a') : '';
  }

  function nextInitiator(){
    if(STATE.nextUp === 'a' || STATE.nextUp === 'b') return STATE.nextUp;
    return autoInitiator();
  }

  function isOverridden(){ return STATE.nextUp === 'a' || STATE.nextUp === 'b'; }

  // A freshly called bet always hands the rotation back to the automatic system.
  function clearOverride(){ delete STATE.nextUp; }

  function betsView(){
    var open = STATE.bets.filter(function(b){ return !b.done; });
    var done = STATE.bets.filter(function(b){ return b.done; });
    var owedA = open.filter(function(b){ return b.owedBy === 'a'; }).length;
    var owedB = open.filter(function(b){ return b.owedBy === 'b'; }).length;

    var summary;
    if(!STATE.bets.length) summary = 'Nothing riding on anything yet.';
    else if(!open.length) summary = '<b>All square.</b> Every bet has been paid up.';
    else summary = '<b>' + open.length + ' outstanding</b> &middot; '
      + esc(STATE.players.a) + ' owes ' + owedA + ' &middot; ' + esc(STATE.players.b) + ' owes ' + owedB
      + (open.length - owedA - owedB > 0 ? ' &middot; ' + (open.length - owedA - owedB) + ' from a tie' : '')
      + (done.length ? ' &middot; ' + done.length + ' settled' : '');

    var initiated = STATE.bets.filter(function(b){ return b.by === 'a' || b.by === 'b'; });
    var last = lastInitiated();
    var byA = initiated.filter(function(b){ return b.by === 'a'; }).length;
    var byB = initiated.filter(function(b){ return b.by === 'b'; }).length;
    var tracker = '';
    if(last){
      tracker = '<div class="lastbet"><span class="lbl">Last bet called by</span>'
        + '<span class="who ' + last.by + '">' + esc(STATE.players[last.by]) + '</span>'
        + '<p class="quote">&ldquo;' + esc(last.text) + '&rdquo;</p>'
        + '<p class="fnote" style="margin:3px 0 0">'
        + (last.matchId && matchLabel(last.matchId) ? esc(matchLabel(last.matchId)) : 'Added straight to the Bets tab &middot; ' + when(last.t))
        + '</p>'
        + '<p class="tallyline">Bets started &mdash; <b class="a">' + esc(STATE.players.a) + ' ' + byA + '</b>'
        + '<span class="sep">&middot;</span><b class="b">' + esc(STATE.players.b) + ' ' + byB + '</b>'
        + (STATE.bets.length > initiated.length
            ? '<span class="sep">&middot;</span><span>' + (STATE.bets.length - initiated.length) + ' with no initiator recorded</span>' : '')
        + '</p></div>';
    }

    function row(b){
      var src = b.matchId ? matchLabel(b.matchId) : '';
      var waitTag = (!b.matchId && !b.done) ? '<span class="sep">&middot;</span><span>waiting for a game</span>' : '';
      var by = (b.by === 'a' || b.by === 'b')
        ? '<span class="sep">&middot;</span><span>called by ' + esc(STATE.players[b.by]) + '</span>'
        : '<span class="needby">Bet initiator?</span>';
      return '<li class="bet' + (b.done ? ' settled' : '') + '">'
        + (readOnly ? '' : '<button class="check" data-bet-toggle="' + b.id + '" aria-pressed="' + (b.done ? 'true' : 'false') + '"'
            + ' aria-label="' + (b.done ? 'Mark unpaid' : 'Mark paid') + '">' + IC_CHECK + '</button>')
        + '<button type="button" class="betmain" data-bet-open="' + b.id + '"'
        + ' aria-label="Details for this bet"><div class="bt">' + esc(b.text) + '</div>'
        + '<div class="bmeta">' + (b.owedBy === 'a' || b.owedBy === 'b'
            ? '<span class="owes ' + b.owedBy + '">' + esc(STATE.players[b.owedBy]) + ' owes</span>'
            : '<span class="needby">Who owes?</span>')
        + by
        + (src ? '<span class="sep">&middot;</span><span>' + esc(src) + '</span>' : waitTag)
        + (b.done ? '<span class="sep">&middot;</span><span>paid ' + when(b.doneAt || b.t) + '</span>' : '')
        + '</div></button>'
        + (readOnly ? '' : '<button class="betkill" data-bet-del="' + b.id + '" aria-label="Delete this bet">&times;</button>')
        + '</li>';
    }

    var form = readOnly ? '' : '<form class="betform" id="bet-form">'
      + '<div><label for="bet-text">' + IC_DICE + 'The bet</label>'
      + '<input class="inp" id="bet-text" name="bet-text" type="text" autocomplete="off" maxlength="90" placeholder="Loser buys tacos" required></div>'
      + '<div class="row"><div><label for="bet-by">Bet initiator</label>'
      + '<select class="inp" id="bet-by" name="bet-by" required>'
      + '<option value="" selected>Who called it?</option>'
      + '<option value="a">' + esc(STATE.players.a) + '</option>'
      + '<option value="b">' + esc(STATE.players.b) + '</option></select></div>'
      + '<div><label for="bet-who">Who owes</label>'
      + '<select class="inp" id="bet-who" name="bet-who">'
      + '<option value="a">' + esc(STATE.players.a) + '</option>'
      + '<option value="b">' + esc(STATE.players.b) + '</option></select></div></div>'
      + '<div class="acts"><button type="submit" class="btn primary">Add bet</button></div>'
      + '</form>';

    // Each pile folds away on its own so a long settled list never buries the live ones.
    function group(key, title, list, shown){
      if(!list.length) return '';
      return '<section class="betgroup"><div class="lhead">'
        + '<button class="lhtoggle" data-betgroup="' + key + '" aria-expanded="' + (shown ? 'true' : 'false') + '">'
        + '<span class="chev">&#9660;</span>' + title + '<span class="cnt">' + list.length + '</span></button>'
        + '</div>'
        + (shown ? '<ul class="betlist">' + list.map(row).join('') + '</ul>' : '')
        + '</section>';
    }

    return '<section class="bets-head"><h1>Bets</h1><p>' + summary + '</p></section>'
      + form
      + tracker
      + group('open', 'Outstanding', open, openOpen)
      + group('done', 'Settled', done, doneOpen)
      + (STATE.bets.length ? '' : '<p class="empty-note">Add one above, or attach a bet to a match from the ledger&rsquo;s Edit button.</p>')
      + '<footer>Bets ride along with the scoreboard &mdash; anyone with the link sees who still owes what.</footer>';
  }


  // ---- calendar -----------------------------------------------------------
  function dayKey(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '';
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function matchesByDay(){
    var map = {};
    STATE.log.forEach(function(e){
      var k = dayKey(e.t);
      if(!k) return;
      (map[k] = map[k] || []).push(e);
    });
    return map;
  }

  function calBase(){
    if(calMonth){
      var p = calMonth.split('-');
      return new Date(+p[0], +p[1] - 1, 1);
    }
    var ref = new Date();
    if(STATE.log.length){
      var last = new Date(STATE.log[STATE.log.length - 1].t);
      if(!isNaN(last)) ref = last;
    }
    return new Date(ref.getFullYear(), ref.getMonth(), 1);
  }

  function shiftMonth(step){
    var b = calBase();
    var n = new Date(b.getFullYear(), b.getMonth() + step, 1);
    calMonth = n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2);
    calDay = '';
  }

  function calHead(base, open){
    var nDays = Object.keys(matchesByDay()).length;
    return '<div class="calhead">'
      + '<button class="lhtoggle" data-cal-toggle="1" aria-expanded="' + (open ? 'true' : 'false') + '">'
      + '<span class="chev">&#9660;</span>Calendar'
      + (open ? '' : '<span class="cnt">' + nDays + (nDays === 1 ? ' Day Played' : ' Days Played') + '</span>') + '</button>'
      + (open ? '<div class="calnav">'
          + '<button type="button" class="cnav" data-cal="prev" aria-label="Previous month">&#8249;</button>'
          + '<span class="mo">' + esc(base.toLocaleDateString(undefined, {month:'long', year:'numeric'})) + '</span>'
          + '<button type="button" class="cnav" data-cal="next" aria-label="Next month">&#8250;</button>'
          + '</div>' : '')
      + '</div>';
  }

  function calendarView(){
    var base = calBase();
    if(!calOpen) return '<section class="cal">' + calHead(base, false) + '</section>';
    var y = base.getFullYear(), m = base.getMonth();
    var byDay = matchesByDay();
    var offset = new Date(y, m, 1).getDay();
    var count = new Date(y, m + 1, 0).getDate();
    var todayKey = dayKey(new Date().toISOString());

    var cells = '';
    var dow = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    for(var i = 0; i < 7; i++) cells += '<div class="cdow">' + dow[i] + '</div>';
    for(var b2 = 0; b2 < offset; b2++) cells += '<div class="cday blank"></div>';
    for(var d = 1; d <= count; d++){
      var key = y + '-' + ('0' + (m + 1)).slice(-2) + '-' + ('0' + d).slice(-2);
      var list = byDay[key] || [];
      var dots = '';
      if(list.length){
        dots = '<span class="dots">'
          + list.slice(0, 4).map(function(e){ return '<i class="' + e.winner + '"></i>'; }).join('')
          + '</span>';
      }
      cells += '<button type="button" class="cday' + (list.length ? ' has' : '') + '"'
        + (list.length ? ' data-day="' + key + '"' : ' disabled')
        + ' aria-pressed="' + (calDay === key ? 'true' : 'false') + '"'
        + (key === todayKey ? ' aria-current="date"' : '')
        + '>' + d + dots + '</button>';
    }

    var picked = calDay ? (byDay[calDay] || []) : [];
    var out = '';
    if(calDay){
      var pd = new Date(calDay + 'T12:00:00');
      var heading = isNaN(pd) ? calDay
        : pd.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
      out = '<div class="dayout"><h4>' + esc(heading) + '</h4>'
        + (picked.length
            ? '<ul class="rows">' + picked.slice().sort(function(x, z){ return new Date(x.t) - new Date(z.t); })
                .map(function(e){
                  var bits = [];
                  if(!e.notime) bits.push('<span class="when">' + clock(e.t) + '</span>');
                  if(e.loc) bits.push('<span class="place">' + esc(e.loc) + '</span>');
                  var tags = [];
                  var bt = betFor(e.id);
                  if(bt) tags.push('<span class="betmark ' + (bt.done ? 'done' : 'open') + '">' + (bt.done ? 'bet settled' : 'bet open') + '</span>');
                  else if(e.nobet) tags.push('<span class="nobetmark">no bet</span>');
                  if(needsInitiator(e)) tags.push('<span class="needby">Bet initiator?</span>');
                  return '<li><span class="chip ' + e.winner + '"></span>'
                    + '<div class="rowmain"><div class="l1">' + outcomeLine(e) + '</div>'
                    + ((bits.length || tags.length)
                        ? '<div class="l2">' + bits.join('<span class="sep">&middot;</span>') + tags.join('') + '</div>' : '')
                    + '</div>'
                    + (e.photo ? '<img class="thumb" src="' + esc(e.photo) + '" alt="Photo from this match" data-photo="' + e.id + '">' : '')
                    + '</li>';
                }).join('') + '</ul>'
            : '<p class="empty-note">Nothing played that day.</p>')
        + '</div>';
    } else {
      out = '<div class="dayout"><p class="empty-note" style="padding:0">Tap any highlighted day to see what was played.</p></div>';
    }

    return '<section class="cal">' + calHead(base, true)
      + '<div class="cgrid">' + cells + '</div>'
      + out + '</section>';
  }

  // ---- the win sheet ------------------------------------------------------
  function openNew(game, winner){
    var now = new Date().toISOString();
    draft = { isNew: true, id: uid(), game: game, winner: winner, t: now,
              useDate: true, useTime: false, loc: '', bet: '', by: '', pick: '', useBet: true, photo: '', err: '' };
    render();
  }

  function openEdit(e){
    var b = betFor(e.id);
    draft = { isNew: false, id: e.id, game: e.game, winner: e.winner, t: e.t,
              useDate: !e.nodate, useTime: !e.notime, loc: e.loc || '',
              bet: (b && b.text) || '', by: (b && b.by) || '', pick: '', useBet: !e.nobet, photo: e.photo || '', err: '' };
    render();
  }

  function readSheet(){
    if(!draft) return;
    var d = document.getElementById('m-date'), t2 = document.getElementById('m-time');
    var l = document.getElementById('m-loc'), b = document.getElementById('m-bet');
    if(d && t2) draft.t = fromParts(draft.useDate ? d.value : toDateInput(draft.t),
                                    draft.useTime ? t2.value : toTimeInput(draft.t), draft.t);
    if(l) draft.loc = (l.value || '').trim().slice(0, 40);
    if(b) draft.bet = (b.value || '').trim().slice(0, 90);
    var by = document.getElementById('m-by');
    if(by) draft.by = (by.value === 'a' || by.value === 'b') ? by.value : '';
    var pk = document.getElementById('m-pick');
    if(pk) draft.pick = pk.value || '';
  }

  function commitSheet(){
    readSheet();
    if(draft.useBet && !draft.pick && draft.bet && !draft.by){
      draft.err = 'Pick who called the bet, or clear the bet line.';
      render();
      var errEl = document.getElementById('m-err');
      if(errEl && errEl.scrollIntoView) errEl.scrollIntoView({block:'center'});
      var byEl = document.getElementById('m-by'); if(byEl) byEl.focus();
      return;
    }
    draft.err = '';
    var loser = draft.winner === 't' ? '' : (draft.winner === 'a' ? 'b' : 'a');
    var entry = null, i;
    for(i = 0; i < STATE.log.length; i++) if(STATE.log[i].id === draft.id) entry = STATE.log[i];
    if(!entry){ entry = { id: draft.id, game: draft.game, winner: draft.winner }; STATE.log.push(entry); }
    entry.t = draft.t;
    if(draft.useDate) delete entry.nodate; else entry.nodate = true;
    if(draft.useTime) delete entry.notime; else entry.notime = true;
    if(draft.loc) entry.loc = draft.loc; else delete entry.loc;
    if(draft.photo) entry.photo = draft.photo; else delete entry.photo;

    var existing = betFor(draft.id);
    if(draft.useBet && draft.pick){
      // A bet that was waiting for a game finally has one.
      delete entry.nobet;
      if(existing && existing.id !== draft.pick && !existing.done){
        STATE.bets = STATE.bets.filter(function(x){ return x.id !== existing.id; });
      }
      attachBet(draft.pick, draft.id);
      STATE.log.sort(function(p, q){ return new Date(p.t) - new Date(q.t); });
      popKey = draft.isNew ? (draft.game + ':' + draft.winner) : null;
      draft = null;
      render(); save();
      return;
    }
    if(!draft.useBet){
      entry.nobet = true;
      if(existing && !existing.done) STATE.bets = STATE.bets.filter(function(x){ return x.id !== existing.id; });
    } else {
      delete entry.nobet;
      if(draft.bet && existing){ existing.text = draft.bet; existing.by = draft.by; }
      else if(draft.bet){
        STATE.bets.push({ id: uid(), text: draft.bet, owedBy: loser, by: draft.by, done: false,
                          t: new Date().toISOString(), matchId: draft.id });
        clearOverride();
      }
      else if(existing && !existing.done) STATE.bets = STATE.bets.filter(function(x){ return x.id !== existing.id; });
    }

    STATE.log.sort(function(p, q){ return new Date(p.t) - new Date(q.t); });
    popKey = draft.isNew ? (draft.game + ':' + draft.winner) : null;
    draft = null;
    render(); save();
  }

  function gameSheet(){

  function chooserSheet(){
    var cur = nextInitiator();

      return '<button type="button" class="pick ' + k + '" data-pick-up="' + k + '"'

  function betSheet(){
    var b = null, i;
    for(i = 0; i < STATE.bets.length; i++) if(STATE.bets[i].id === betView) b = STATE.bets[i];
    if(!b) return '';
    var match = null;
    if(b.matchId) for(i = 0; i < STATE.log.length; i++) if(STATE.log[i].id === b.matchId) match = STATE.log[i];

    var tags = '<span class="betmark ' + (b.done ? 'done' : 'open') + '">'
      + (b.done ? 'settled' : 'outstanding') + '</span>';
    if(b.by !== 'a' && b.by !== 'b') tags += '<span class="needby">Bet initiator?</span>';

    var linked;
    if(match){
      var sub = [];
      if(!match.nodate) sub.push('<span>' + when(match.t) + '</span>');
      if(!match.notime) sub.push('<span>' + clock(match.t) + '</span>');
      if(match.loc) sub.push('<span class="place">' + esc(match.loc) + '</span>');
      linked = '<div class="bdmatch"><div class="bdm">'
        + '<div class="bdt">' + (match.winner === 't'
            ? '<span class="w t">Tied</span> at ' + esc(gameName(match.game))
            : '<span class="w ' + match.winner + '">' + esc(STATE.players[match.winner]) + '</span>'
              + ' took ' + esc(gameName(match.game))) + '</div>'
        + (sub.length ? '<div class="bdsub">' + sub.join('<span class="sep">&middot;</span>') + '</div>' : '')
        + '</div>'
        + (match.photo ? '<img src="' + esc(match.photo) + '" alt="Photo from this match" data-photo="' + match.id + '">' : '')
        + '</div>'
        + (readOnly ? '' : '<div class="acts"><button type="button" class="btn" data-open-match="' + match.id + '">Open this match</button></div>');
    } else if(b.matchId){
      linked = '<p class="synctxt">This bet was attached to a match that has since been deleted, so there is nothing left to open.</p>';
    } else {
      // Logged ahead of the game: offer the matches that have nothing riding on them.
      var free = STATE.log.filter(function(e){ return !betFor(e.id); })
                          .slice().sort(function(x, y){ return new Date(y.t) - new Date(x.t); })
                          .slice(0, 12);
      linked = '<p class="synctxt">Waiting for a game. Attach it to a match here, or pick it from the bet line '
        + 'the next time you log a win.</p>'
        + (free.length
            ? '<form id="attach-form"><label for="bd-match">Attach to a match</label>'

              + free.map(function(e){
                  return '<option value="' + e.id + '">'
                    + (e.winner === 't' ? 'Tied at ' + esc(gameName(e.game))
                                        : esc(STATE.players[e.winner]) + ' took ' + esc(gameName(e.game)))
                    + (e.nodate ? '' : ' \u00b7 ' + when(e.t)) + '</option>';
                }).join('')
              + '</select>'
              + '<div class="acts"><button type="submit" class="btn" data-attach="' + b.id + '">Attach</button></div></form>'
            : '<p class="fnote" style="margin:0">Every match already has a bet on it, so there is nothing to attach this to yet.</p>');
    }

    if(betEdit){
      var opt = function(cur, k, label){
        return '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + label + '</option>';
      };
      return '<div class="scrim" data-close-bet="1"><form class="sheet" id="bet-edit-form" novalidate>'
        + '<h2>Edit the bet</h2>'
        + '<p class="lead">Added ' + when(b.t) + (b.matchId && matchLabel(b.matchId) ? ' \u00b7 ' + esc(matchLabel(b.matchId)) : '') + '</p>'
        + '<div><label for="be-text">' + IC_DICE + 'The bet</label>'
        + '<input class="inp" id="be-text" name="be-text" type="text" autocomplete="off" maxlength="90"'
        + ' value="' + esc(b.text) + '" required></div>'
        + '<div class="row"><div><label for="be-by">Bet initiator</label>'
        + '<select class="inp" id="be-by" name="be-by">'
        + opt(b.by, '', 'Who called it?') + opt(b.by, 'a', esc(STATE.players.a)) + opt(b.by, 'b', esc(STATE.players.b))
        + '</select></div>'
        + '<div><label for="be-who">Who owes</label>'
        + '<select class="inp" id="be-who" name="be-who">'
        + opt(b.owedBy, '', 'Nobody yet') + opt(b.owedBy, 'a', esc(STATE.players.a)) + opt(b.owedBy, 'b', esc(STATE.players.b))
        + '</select></div></div>'
        + (b.matchId
            ? '<div><label>Linked match</label>'
              + '<p class="fnote" style="margin:0 0 7px">'
              + (matchLabel(b.matchId) ? esc(matchLabel(b.matchId)) : 'That match has since been deleted.') + '</p>'
              + '<button type="button" class="btn" data-bet-unlink="' + b.id + '">Unlink from the match</button></div>'
            : '')
        + (lockErr ? '<p class="sheeterr">' + esc(lockErr) + '</p>' : '')
        + '<div class="acts"><button type="button" class="btn primary" data-bet-save="' + b.id + '">Save changes</button>'
        + '<button type="button" class="btn" data-bet-cancel="1">Cancel</button></div>'
        + '</form></div>';
    }

    return '<div class="scrim" data-close-bet="1"><div class="sheet">'
      + '<h2>The bet</h2>'
      + '<p class="bt" style="font-size:16px">' + esc(b.text) + '</p>'
      + '<div class="bdrow">' + tags + '</div>'
      + '<div class="bdrow"><span class="synctxt">'
      + (b.owedBy === 'a' || b.owedBy === 'b'
          ? '<b class="owes ' + b.owedBy + '">' + esc(STATE.players[b.owedBy]) + '</b> owes'

      + ' &middot; added ' + when(b.t)
      + (b.done ? ' &middot; paid ' + when(b.doneAt || b.t) : '') + '</span></div>'
      + (readOnly || (b.owedBy === 'a' || b.owedBy === 'b') ? ''
          : '<div><label>Who owes this one?</label>'
            + '<p class="fnote" style="margin:0 0 7px">The match was a tie, so it is yours to settle.</p>'
            + '<div class="pickrow">'
            + '<button type="button" class="pick a" data-owes="' + b.id + ':a">' + esc(STATE.players.a) + '</button>'
            + '<button type="button" class="pick b" data-owes="' + b.id + ':b">' + esc(STATE.players.b) + '</button>'

          + (b.done ? 'Mark unpaid' : 'Mark paid') + '</button>')
      + (readOnly ? '' : '<button type="button" class="btn" data-bet-edit="1">Edit</button>')
      + '<button type="button" class="btn" data-close-bet="1">Close</button></div>'
      + '</div></div>';
  }

  function sheet(){
    if(gameMenu) return gameSheet();

    var who = esc(sideName(draft.winner));

      + '<div><div class="trow"><span class="tl">' + IC_CLOCK + 'Time</span>' + sw('time', draft.useTime) + '</div>'
      + '<div class="field' + (draft.useTime ? '' : ' off') + '" style="margin-top:6px">'
      + '<input class="inp" id="m-time" name="m-time" type="time" value="' + toTimeInput(draft.t) + '"></div></div>'

      + '<div><label for="m-loc">' + IC_PIN + 'Location</label>'
      + '<input class="inp" id="m-loc" name="m-loc" type="text" list="places" autocomplete="off" maxlength="40"'
      + ' placeholder="The garage" value="' + esc(draft.loc) + '"></div>'

      + '<div><div class="trow"><span class="tl">' + IC_DICE + 'Bet on this one</span>' + sw('bet', draft.useBet) + '</div>'
      + '<div class="field' + (draft.useBet ? '' : ' off') + '" style="margin-top:6px">'

          ? '<div style="margin-bottom:9px"><label for="m-pick">Use a bet you already logged</label>'

              }).join('')
            + '</select></div>'
          : '')
      + (picked
          ? '<p class="fnote" style="margin:0">Logging this match settles <b>' + esc(picked.text) + '</b>'
            + ((picked.by === 'a' || picked.by === 'b') ? ', called by ' + esc(STATE.players[picked.by]) : '')
            + '. ' + (tie ? 'A tie leaves who owes it open.' : esc(loser) + ' lost, so ' + esc(loser) + ' owes.') + '</p>'
          : '<input class="inp" id="m-bet" name="m-bet" type="text" autocomplete="off" maxlength="90"'

      + '<select class="inp" id="m-by" name="m-by">'

      + '<option value="a"' + (draft.by === 'a' ? ' selected' : '') + '>' + esc(STATE.players.a) + '</option>'
      + '<option value="b"' + (draft.by === 'b' ? ' selected' : '') + '>' + esc(STATE.players.b) + '</option></select></div>'
      + '<p class="fnote">' + (tie

      + '</div>'

      + '<div class="acts"><button type="button" class="btn primary" data-save-sheet="1">' + (draft.isNew ? 'Log it' : 'Save changes') + '</button>'
      + '<button type="button" class="btn" data-close-sheet="1">Cancel</button></div>'
      + datalist()
      + '</form></div>';
  }

  function shrinkPhoto(file){
    var fr = new FileReader();
    fr.onerror = function(){ draft.err = 'That file could not be read.'; render(); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ if(draft){ draft.err = 'That file is not an image this browser can open.'; render(); } };
      img.onload = function(){
        if(!draft) return;
        var max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s));
        c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try{ draft.photo = c.toDataURL('image/jpeg', 0.62); draft.err = ''; }
        catch(err){ draft.err = 'This browser blocked reading that image.'; }
        render();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function render(){
    if(locked){ root.innerHTML = lockView(); popKey = null; return; }
    var t = tally();
    var label = statusLabel(status);
    var banner = '';
    if(readOnly){
      banner = '<div class="banner"><b>View only.</b> You can follow the running score here, but logging a win needs edit access to this page.</div>';
    } else if(mode === 'cloud' && (needsSetup || !gh.token)){
      banner = '<div class="banner"><b>Not set up yet.</b> This page is served from your repo but has no board in it. '
        + 'Open <button class="linkish" data-tab="settings">Settings</button> to finish the setup.</div>';
    } else if(mode === 'local'){
      banner = '<div class="banner"><b>Saving to this device only.</b> Taps here stay in this browser. '
        + 'Open <button class="linkish" data-tab="settings">Settings</button> to share one score across both phones.</div>';
    } else if(mode === 'cloud' && syncErr){
      banner = '<div class="banner"><b>Couldn&rsquo;t reach the shared board.</b> ' + esc(syncErr)
        + ' Your taps are saved on this phone and will go up on the next successful save.</div>';
    } else if(status === 'error'){
      banner = '<div class="banner"><b>That win didn’t save.</b> It’s showing on this screen but won’t reach the other phone &mdash; try tapping again.</div>';
    }
    var openBets = STATE.bets.filter(function(b){ return !b.done; }).length;
    var up = nextInitiator();
    var tabs = '<div class="tabrow"><div class="tabs" role="tablist">'
      + '<button class="tab" role="tab" data-tab="board" aria-selected="' + (view === 'board') + '">Scoreboard</button>'
      + '<button class="tab" role="tab" data-tab="bets" aria-selected="' + (view === 'bets') + '">Bets'
      + (openBets ? '<span class="pill">' + openBets + '</span>' : '') + '</button></div>'
      + '<button type="button" class="nextup" data-open-up="1" aria-label="Change who is up next">'

  // ---- persistence --------------------------------------------------------
  function DOC(state){
    return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'

      + '<div id="root"></div>'
      + '<script>(' + APP.toString() + ')();<\/script>'
      + '</body></html>';
  }

  function getApi(){
    if(api !== undefined) return Promise.resolve(api);
    if(!(window.claude && typeof window.claude.use === 'function')){ api = null; return Promise.resolve(api); }
    return window.claude.use('artifact').then(function(x){ api = x || null; return api; },
                                             function(){ api = null; return api; });
  }

  function statusLabel(s){
    if(s === 'saving') return 'Saving';
    if(s === 'saved') return 'Saved';
    if(s === 'error') return 'Not saved';
    return mode === 'cloud' ? 'Shared' : mode === 'local' ? 'This device' : 'Live';
  }

  // Only the gear carries the save state now, as a coloured dot on its corner.
  function setStatus(s){
    status = s;
    var el = root.querySelector('.gear');
    if(el){
      el.setAttribute('data-s', s);
      el.setAttribute('title', 'Settings · ' + statusLabel(s));
      el.setAttribute('aria-label', 'Settings. ' + statusLabel(s));
    }
  }

  // ---- the passcode -------------------------------------------------------
  // With a passcode set, nothing readable leaves the phone: the board is
  // encrypted here and the sync service only ever holds ciphertext. That also
  // means a forgotten passcode is the end of the board - there is no reset.
  function subtle(){
    return (window.crypto && window.crypto.subtle && window.TextEncoder) ? window.crypto.subtle : null;
  }

  function b64(buf){
    var a = new Uint8Array(buf), s = '';
    for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }

  function unb64(s){
    var bin = atob(String(s || '')), a = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function deriveKey(phrase, saltB64){
    var sub = subtle();
    if(!sub) return Promise.reject(new Error('This browser cannot lock the board.'));
    return sub.importKey('raw', new TextEncoder().encode(phrase), {name:'PBKDF2'}, false, ['deriveKey'])
      .then(function(base){
        return sub.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:200000, hash:'SHA-256'},
                             base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
      });
  }

  function sealState(){
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return subtle().encrypt({name:'AES-GCM', iv:iv}, cryptoKey, new TextEncoder().encode(JSON.stringify(STATE)))
      .then(function(ct){ return {enc:1, v:1, salt:cryptoSalt, iv:b64(iv), ct:b64(ct)}; });
  }

  function sealText(str){
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    return subtle().encrypt({name:'AES-GCM', iv:iv}, cryptoKey, new TextEncoder().encode(String(str)))
      .then(function(ct){ return {enc:1, v:1, salt:cryptoSalt, iv:b64(iv), ct:b64(ct)}; });
  }

  function openText(blob){
    return subtle().decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, cryptoKey, unb64(blob.ct))
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }

  function openBlob(blob){
    return subtle().decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, cryptoKey, unb64(blob.ct))
      .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
  }

  function rememberPass(phrase){
    passPhrase = phrase;
    try{ window.localStorage.setItem(PASS_KEY, phrase); }catch(err){}
  }

  function forgetPass(){
    passPhrase = ''; cryptoKey = null;
    try{ window.localStorage.removeItem(PASS_KEY); }catch(err){}
  }

  function adopt(data){
    var s = JSON.stringify(data);
    if(s !== lastRemote){
      lastRemote = s;
      STATE = data;
      if(!STATE.bets) STATE.bets = [];
      mirrorLocal();
    }
  }

  function lockView(){
    var other = STATE.players && STATE.players.b ? esc(STATE.players.a) + ' and ' + esc(STATE.players.b) : 'you both';
    return '<div class="wrap lockwrap">'
      + '<h1 class="lockmark">Bets, Banter, and Beauty</h1>'
      + '<p class="lead">This board is locked. Enter the passcode ' + other + ' share.</p>'
      + '<form class="betform" id="lock-form">'
      + '<div><label for="lock-pass">Passcode</label>'
      + '<input class="inp" id="lock-pass" name="lock-pass" type="password" autocomplete="current-password"'
      + ' autocapitalize="off" autocorrect="off" spellcheck="false" required></div>'
      + (lockErr ? '<p class="sheeterr">' + esc(lockErr) + '</p>' : '')
      + '<div class="acts"><button type="submit" class="btn primary">Unlock</button></div>'
      + '<p class="fnote" style="margin:0">Unlocking is remembered on this phone until you clear it in Settings.</p>'
      + '</form>'
      + '<p class="fnote lockout">Wrong board? <button type="button" class="linkish" data-disconnect="1">Disconnect from it</button></p>'
      + '</div>';
  }

  // ---- shared board: the repo itself --------------------------------------
  // The page lives in a GitHub repo, so the board lives there too: one JSON file
  // committed through the API. Everything in it is encrypted with the passcode,
  // and the write token rides along in a second file, encrypted the same way, so
  // the other phone needs nothing but the passcode.
  function detectRepo(){
    var h = String(location.hostname || ''), seg = String(location.pathname || '').split('/').filter(Boolean);
    var m = h.match(/^([^.]+)\.github\.io$/i);
    if(!m) return null;
    return { owner: m[1], repo: seg.length ? seg[0] : (m[1] + '.github.io') };
  }

  function saveGh(){
    try{ window.localStorage.setItem(GH_KEY, JSON.stringify(gh)); }catch(err){}
  }

  function apiBase(){
    return 'https://api.github.com/repos/' + encodeURIComponent(gh.owner) + '/' + encodeURIComponent(gh.repo) + '/contents/';
  }

  function ghHeaders(auth){
    var h = { 'Accept': 'application/vnd.github+json' };
    if(auth && gh.token) h['Authorization'] = 'Bearer ' + gh.token;
    return h;
  }

  function ghRead(file, auth, etag, shaOnly){
    var h = ghHeaders(auth);
    if(etag) h['If-None-Match'] = etag;
    return fetch(apiBase() + file + '?ref=' + encodeURIComponent(gh.branch) + '&t=' + Date.now(), { headers: h })
      .then(function(r){
        if(r.status === 304) return { unchanged: true };
        if(r.status === 404) return { missing: true };
        if(r.status === 401 || r.status === 403){
          return r.json().then(function(j){
            throw new Error((j && j.message) ? j.message : 'GitHub refused that request.');
          }, function(){ throw new Error('GitHub refused that request.'); });
        }
        if(!r.ok) throw new Error('GitHub answered ' + r.status + '.');
        var tag = r.headers.get('ETag') || '';
        return r.json().then(function(j){
          if(shaOnly) return { sha: j.sha, etag: tag };
          var txt = '';
          try{ txt = decodeURIComponent(escape(atob(String(j.content || '').replace(/\s/g, '')))); }
          catch(err){ txt = atob(String(j.content || '').replace(/\s/g, '')); }
          return { text: txt, sha: j.sha, etag: tag };
        });
      });
  }

  function ghWrite(file, text, sha, message){
    var b;
    try{ b = btoa(unescape(encodeURIComponent(text))); }catch(err){ b = btoa(text); }
    return ghPutRaw(file, b, sha, message);
  }

  function ghPutRaw(file, b, sha, message){
    return fetch(apiBase() + file, {
      method: 'PUT',
      headers: (function(){ var h = ghHeaders(true); h['Content-Type'] = 'application/json'; return h; })(),
      body: JSON.stringify({ message: message, content: b, branch: gh.branch, sha: sha || undefined })
    }).then(function(r){
      if(r.status === 409 || r.status === 422) return { stale: true };
      if(!r.ok){
        return r.json().then(function(j){
          throw new Error((j && j.message) ? j.message : ('GitHub answered ' + r.status + '.'));
        }, function(){ throw new Error('GitHub answered ' + r.status + '.'); });
      }
      return r.json().then(function(j){ return { sha: j.content && j.content.sha }; });
    });
  }

  function shareLink(){
    return location.origin + location.pathname;
  }

  function startPolling(){
    if(poller || mode !== 'cloud') return;
    poller = setInterval(function(){
      if(locked || !gh.token) return;                                           // nothing to refresh until the passcode is in
      if(draft || photoView || chooser || betView || gameMenu || adding || timer) return;   // don't yank an open sheet or a pending save out from under anyone
      pullCloud(false);
    }, 20000);
  }

  // The passcode gets us the token, which gets us everything else.
  function unlockWith(phrase){
    lockErr = '';
    return ghRead(ACCESS_FILE, false).then(function(res){
      if(res.missing) throw new Error('This board has no passcode file yet. Set it up from the phone that created it.');
      var blob = JSON.parse(res.text);
      cryptoSalt = blob.salt;
      return deriveKey(phrase, blob.salt).then(function(k){
        cryptoKey = k;
        return openText(blob);
      });
    }).then(function(token){
      gh.token = String(token || '').trim();
      saveGh();
      rememberPass(phrase);
      locked = false;
      return pullCloud(true).then(startPolling);
    });
  }

  function pullCloud(initial){
    return ghRead(BOARD_FILE, !!gh.token, boardEtag)
      .then(function(res){
        if(res.unchanged){ status = 'idle'; return; }
        if(res.missing){
          // Nothing on the repo yet: this copy is the one that seeds it.
          syncErr = ''; needsSetup = true; status = 'idle'; render(); return;
        }
        needsSetup = false;
        boardEtag = res.etag; boardSha = res.sha;
        var data = JSON.parse(res.text);
        if(data && data.enc){
          if(!subtle()) throw new Error('This board is locked and this browser cannot decrypt. Open the https link rather than a saved file.');
          cryptoSalt = data.salt;
          if(!cryptoKey){
            if(!passPhrase){ locked = true; syncErr = ''; status = 'idle'; render(); return; }
            return deriveKey(passPhrase, data.salt).then(function(k){ cryptoKey = k; return openBlob(data); })
              .then(function(plain){ landed(plain); }, function(){
                cryptoKey = null; forgetPass(); locked = true;
                lockErr = 'That passcode did not open this board.';
                status = 'idle'; render();
              });
          }
          return openBlob(data).then(function(plain){ landed(plain); }, function(){
            cryptoKey = null; forgetPass(); locked = true;
            lockErr = 'That passcode did not open this board.';
            status = 'idle'; render();
          });
        }
        landed(data);
      })
      .catch(function(e){
        syncErr = e.message || String(e);
        status = 'error';
        if(initial) render(); else setStatus('error');
      });
  }

  function landed(plain){
    if(!plain || !plain.games || !plain.log) throw new Error('The board file on the repo is not a scoreboard.');
    locked = false; lockErr = ''; syncErr = '';
    adopt(plain);
    applyIcon();
    status = 'idle';
    render();
  }

  function pushCloud(){
    if(!gh.token){ syncErr = 'No write access on this phone yet.'; status = 'error'; render(); return Promise.resolve(); }
    var plain = JSON.stringify(STATE);
    var prep = cryptoKey ? sealState().then(function(o){ return JSON.stringify(o); }) : Promise.resolve(plain);
    return prep.then(function(text){
      if(text.length > 900000) throw new Error('The board has grown past what a single commit should carry. Remove a photo or two.');
      return ghWrite(BOARD_FILE, text, boardSha, 'Score update').then(function(res){
        if(!res.stale) return res;
        // Someone else committed first: take their sha and land on top of it.
        return ghRead(BOARD_FILE, true).then(function(cur){
          boardSha = cur.sha;
          return ghWrite(BOARD_FILE, text, boardSha, 'Score update');
        });
      });
    }).then(function(res){
      if(res && res.sha) boardSha = res.sha;
      boardEtag = '';
      lastRemote = plain; syncErr = ''; setStatus('saved');
    }).catch(function(e){
      syncErr = e.message || String(e); status = 'error'; render();
    });
  }

  // First run on the repo: write the board and the encrypted token.
  function setUpBoard(token, phrase){
    gh.token = String(token || '').trim();
    saveGh();
    cryptoSalt = b64(window.crypto.getRandomValues(new Uint8Array(16)));
    return deriveKey(phrase, cryptoSalt).then(function(k){
      cryptoKey = k;
      rememberPass(phrase);
      return sealText(gh.token);
    }).then(function(blob){
      return ghRead(ACCESS_FILE, true).then(function(cur){
        return ghWrite(ACCESS_FILE, JSON.stringify(blob), cur.missing ? '' : cur.sha, 'Set the passcode');
      });
    }).then(function(){
      return ghRead(BOARD_FILE, true).then(function(cur){ boardSha = cur.missing ? '' : cur.sha; });
    }).then(function(){
      needsSetup = false; locked = false;
      return pushCloud().then(startPolling);
    });
  }

  function disconnectBoard(){
    gh.token = ''; saveGh();
    forgetPass();
    cryptoKey = null; boardSha = ''; boardEtag = ''; lastRemote = '';
    if(poller){ clearInterval(poller); poller = null; }
    locked = false; status = 'idle'; render();
  }


  // ---- the home-screen icon ----------------------------------------------
  // The icon has to be readable before anyone types a passcode, so it is the one
  // thing that cannot be encrypted: it goes into the repo as an ordinary image.
  var ICON_SIZES = [{ file: 'icon-180.png', n: 180 }, { file: 'icon-512.png', n: 512 }, { file: 'icon-32.png', n: 32 }];

  function squareIcon(file, size){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = function(){ rej(new Error('That file could not be read.')); };
      fr.onload = function(){
        var img = new Image();
        img.onerror = function(){ rej(new Error('That is not an image this browser can open.')); };
        img.onload = function(){
          var side = Math.min(img.width, img.height);
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
          try{ res(c.toDataURL('image/png').split(',')[1]); }
          catch(err){ rej(new Error('This browser blocked reading that image.')); }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function applyIcon(){
    if(!STATE.icon) return;
    var tag = document.querySelector('link[rel="apple-touch-icon"]');
    if(tag) tag.href = 'icon-180.png?v=' + STATE.icon;
    var fav = document.querySelector('link[rel="icon"]');
    if(fav) fav.href = 'icon-32.png?v=' + STATE.icon;
  }

  function setAppIcon(file){
    iconErr = ''; iconBusy = true; render(); setStatus('saving');
    var chain = Promise.resolve();
    ICON_SIZES.forEach(function(job){
      chain = chain.then(function(){
        return squareIcon(file, job.n).then(function(b64png){
          return ghRead(job.file, true, '', true).then(function(cur){
            return ghPutRaw(job.file, b64png, cur.missing ? '' : cur.sha, 'New app icon');
          });
        });
      });
    });
    chain.then(function(){
      STATE.icon = Date.now();
      iconBusy = false;
      applyIcon();
      render(); save();
    }, function(e){
      iconBusy = false;
      iconErr = (e && e.message) ? e.message : 'That icon could not be saved.';
      status = 'idle'; render();
    });
  }

  function iconSection(){

      + '</section>'

      + '<section class="setgroup"><div class="lhead">'
      + '<button class="lhtoggle" data-sync-toggle="1" aria-expanded="' + (syncOpen ? 'true' : 'false') + '">'

      + (syncOpen ? '' : '<span class="cnt">' + (mode === 'cloud' && gh.token ? 'Connected' : mode === 'artifact' ? 'Inside Claude' : 'Not shared') + '</span>')

      + passcodeSection()
      + iconSection();
  }

  function passcodeSection(){
    if(mode !== 'cloud' || !gh.token || needsSetup) return '';
    var body;
    if(!subtle()){
      body = '<p class="synctxt">This browser will not do the encryption a passcode needs. '
        + 'It works on the https link &mdash; not on a file opened straight off the phone.</p>';
    } else {
      body = '<p class="synctxt"><b>The board is locked.</b> The file in the repo is scrambled, and so is the write access '
        + 'stored beside it &mdash; the passcode never leaves your phones, so a stranger who finds the repo sees nothing but noise.</p>'
        + '<div class="acts"><button type="button" class="btn" data-pass-forget="1">Forget it on this phone</button></div>'
        + '<p class="fnote" style="margin:0">Forgetting clears the passcode and the write access here only. '
        + 'The board stays locked and asks again next time.</p>';
    }
    return '<section class="setgroup"><h3>' + IC_LOCK + 'Passcode</h3>'
      + '<div class="betform">' + body + '</div></section>';
  }

  function goLocal(){
    // No save-back channel on this page (published without it, or this viewer can't write).
    // Keep the board usable and say plainly where the score is going.
    localMode = true;
    mode = 'local';
    render();
    save();
  }

  function save(){
    if(readOnly) return;
    if(mode === 'cloud'){
      mirrorLocal();
      setStatus('saving');
      clearTimeout(timer);
      timer = setTimeout(function(){ timer = null; pushCloud(); }, 700);
      return;
    }
    if(mode === 'local'){
      try{ window.localStorage.setItem(LS_KEY, JSON.stringify(STATE)); setStatus('saved'); }
      catch(err){ status = 'error'; render(); }
      return;
    }
    setStatus('saving');
    clearTimeout(timer);
    timer = setTimeout(function(){
      getApi().then(function(a){
        if(!a){ goLocal(); return; }
        return a.publish(DOC(STATE)).then(function(){ setStatus('saved'); }, function(err){
          var code = err && err.code;
          if(code === 'conflict'){ return; }             // a newer version wins; this view reloads to it
          if(code === 'not_writer' || code === 'not_granted'){ goLocal(); return; }
          status = 'error'; render();
        });
      });
    }, 1100);
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Renaming keeps the game's id, so every match, tie and bet stays attached.
  function saveGameEdit(){
    if(readOnly || !gameMenu) return;
    var nameEl = document.getElementById('ge-name'), ruleEl = document.getElementById('ge-rule');
    if(!nameEl || !ruleEl) return;
    var name = (nameEl.value || '').trim().slice(0, 28);
    var rule = (ruleEl.value || '').trim().slice(0, 52);
    if(!name){ lockErr = 'A game needs a name.'; render(); focusEnd('ge-name'); return; }
    var g = null, clash = false, i;
    for(i = 0; i < STATE.games.length; i++){
      if(STATE.games[i].id === gameMenu) g = STATE.games[i];
      else if(STATE.games[i].name.toLowerCase() === name.toLowerCase()) clash = true;
    }
    if(!g){ gameEdit = false; gameMenu = ''; render(); return; }
    if(clash){ lockErr = 'There is already a game called ' + name + '.'; render(); focusEnd('ge-name'); return; }
    // Back to the board once saved: the card shows the change, and the undo toast
    // would otherwise sit on top of the sheet's buttons.
    lockErr = ''; gameEdit = false; gameMenu = '';
    if(name === g.name && rule === (g.rule || '')){ render(); return; }
    snapshot('Edited ' + g.name);
    g.name = name;
    if(rule) g.rule = rule; else delete g.rule;
    render(); save();
  }

  function focusEnd(id){
    var el = document.getElementById(id);
    if(!el) return;
    try{ el.focus(); var n = el.value.length; el.setSelectionRange(n, n); }catch(err){}
  }

  // Anything destructive stashes the whole board first, so one tap puts it back.
  function snapshot(label){
    undoSnap = JSON.stringify(STATE);
    undoLabel = label;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){ undoSnap = null; undoLabel = ''; render(); }, 30000);
  }

  function clearUndo(){
    undoSnap = null; undoLabel = ''; clearTimeout(undoTimer);
  }

  function doUndo(){
    if(!undoSnap) return;
    var restored = undoSnap;
    clearUndo();
    try{ STATE = JSON.parse(restored); }catch(err){ render(); return; }
    if(!STATE.bets) STATE.bets = [];
    render(); save();
  }

  function toast(){
    if(!undoSnap) return '';
    // With a sheet up, the toast moves to the top so it never covers the sheet's buttons.
    var up = (gameMenu || betView || chooser || photoView || draft) ? ' up' : '';
    return '<div class="toast' + up + '"><span class="tmsg">' + esc(undoLabel) + '</span>'
      + '<button type="button" class="tbtn" data-undo-action="1">Undo</button>'
      + '<button type="button" class="tx" data-dismiss-undo="1" aria-label="Dismiss">&times;</button></div>';
  }

  root.addEventListener('change', function(ev){
    if(ev.target && ev.target.id === 'm-photo' && draft){
      var f = ev.target.files && ev.target.files[0];
      if(f){ readSheet(); shrinkPhoto(f); }
      return;
    }
    if(ev.target && ev.target.id === 'icon-file'){
      var pic = ev.target.files && ev.target.files[0];
      if(pic) setAppIcon(pic);
      return;
    }
    if(draft && ev.target && ev.target.id === 'm-pick'){ readSheet(); render(); return; }
    if(draft && ev.target && ev.target.closest && ev.target.closest('#win-form')) readSheet();
  });

  // Keep the draft current as things are typed or picked, so a date or time is
  // already banked before the Save tap - phone date pickers like to eat the first one.
  root.addEventListener('input', function(ev){
    if(draft && ev.target && ev.target.closest && ev.target.closest('#win-form')) readSheet();
  });

  root.addEventListener('submit', function(ev){
    if(ev.target.closest('#game-edit-form')){
      ev.preventDefault();
      saveGameEdit();
      return;
    }
    if(ev.target.closest('#win-form')){
      ev.preventDefault();
      if(readOnly || !draft) return;
      commitSheet();
      return;
    }
    var lf = ev.target.closest('#lock-form');
    if(lf){
      ev.preventDefault();
      var pEl = document.getElementById('lock-pass');
      var phrase = pEl.value || '';
      if(!phrase){ pEl.focus(); return; }
      lockErr = ''; setStatus('saving');
      unlockWith(phrase).catch(function(e){
        cryptoKey = null; gh.token = ''; saveGh(); forgetPass();
        locked = true;
        lockErr = (e && e.message && /passcode|decrypt/i.test(e.message)) ? e.message : 'That passcode did not open this board.';
        status = 'idle'; render();
      });
      return;
    }
    var af = ev.target.closest('#attach-form');
    if(af){
      ev.preventDefault();
      if(readOnly) return;
      var btn = af.querySelector('[data-attach]');
      var sel = document.getElementById('bd-match');
      if(!btn || !sel || !sel.value) return;
      snapshot('Attached a bet to ' + gameName((function(){
        var g = ''; STATE.log.forEach(function(e){ if(e.id === sel.value) g = e.game; }); return g;
      })()));
      attachBet(btn.getAttribute('data-attach'), sel.value);
      render(); save();
      return;
    }
    var gf = ev.target.closest('#gh-form');
    if(gf){
      ev.preventDefault();
      var tk = (document.getElementById('gh-token').value || '').trim();
      var q1 = document.getElementById('gh-pass').value || '';
      var q2 = document.getElementById('gh-pass2').value || '';
      if(!tk){ lockErr = 'Paste the repo token first.'; render(); return; }
      if(q1.length < 8){ lockErr = 'Use at least eight characters &mdash; this one guards the repo too.'; render(); return; }
      if(q1 !== q2){ lockErr = 'Those two passcodes do not match.'; render(); return; }
      lockErr = ''; lockBusy = true; render(); setStatus('saving');
      setUpBoard(tk, q1).then(function(){
        lockBusy = false; render();
      }, function(e){
        lockBusy = false;
        gh.token = ''; saveGh(); forgetPass(); cryptoKey = null;
        lockErr = (e && e.message) ? e.message : 'That did not work.';
        status = 'idle'; render();
      });
      return;
    }
    var bf = ev.target.closest('#bet-form');
    if(bf){
      ev.preventDefault();
      if(readOnly) return;
      var txtEl = document.getElementById('bet-text');
      var txt = (txtEl.value || '').trim().slice(0, 90);
      if(!txt){ txtEl.focus(); return; }
      var byEl2 = document.getElementById('bet-by');
      var byVal = byEl2.value;
      if(byVal !== 'a' && byVal !== 'b'){ byEl2.focus(); return; }
      STATE.bets.push({ id: uid(), text: txt,
                        owedBy: document.getElementById('bet-who').value === 'b' ? 'b' : 'a',
                        by: byVal, done: false, t: new Date().toISOString() });
      clearOverride();
      render(); save();
      return;
    }
    if(!ev.target.closest('#add-form')) return;
    ev.preventDefault();
    if(readOnly) return;
    var nameEl = document.getElementById('add-name'), ruleEl = document.getElementById('add-rule');
    var name = (nameEl.value || '').trim().slice(0, 28);
    if(!name){ nameEl.focus(); return; }
    STATE.games.push({ id: slug(name), name: name, rule: (ruleEl.value || '').trim().slice(0, 52), custom: true });
    adding = false;
    render(); save();
  });

  root.addEventListener('click', function(ev){
    if(ev.target.closest('[data-undo-action]')){ doUndo(); return; }
    if(ev.target.closest('[data-dismiss-undo]')){ clearUndo(); render(); return; }
    var onScrim = ev.target.classList && ev.target.classList.contains('scrim');
    if(betView){
      if(betEdit){
        var sv = ev.target.closest('[data-bet-save]');
        if(sv && !readOnly){
          var txtE = document.getElementById('be-text');
          var newText = (txtE.value || '').trim().slice(0, 90);
          if(!newText){ lockErr = 'A bet needs something written on it.'; render(); return; }
          var newBy = document.getElementById('be-by').value;
          var newWho = document.getElementById('be-who').value;
          snapshot('Edited a bet');
          STATE.bets.forEach(function(x){
            if(x.id !== sv.getAttribute('data-bet-save')) return;
            x.text = newText;
            if(newBy === 'a' || newBy === 'b') x.by = newBy; else delete x.by;
            if(newWho === 'a' || newWho === 'b') x.owedBy = newWho; else x.owedBy = '';
          });
          lockErr = ''; betEdit = false;
          render(); save(); return;
        }
        var un = ev.target.closest('[data-bet-unlink]');
        if(un && !readOnly){
          var uid2 = un.getAttribute('data-bet-unlink');
          snapshot('Unlinked a bet from its match');
          STATE.bets.forEach(function(x){ if(x.id === uid2) delete x.matchId; });
          render(); save(); return;
        }
        if(ev.target.closest('[data-bet-cancel]')){ betEdit = false; lockErr = ''; render(); return; }
        if(onScrim){ betEdit = false; lockErr = ''; betView = ''; render(); }
        return;
      }
      if(ev.target.closest('[data-bet-edit]')){ betEdit = true; lockErr = ''; render(); return; }
      var ph = ev.target.closest('[data-photo]');
      if(ph){
        var pid2 = ph.getAttribute('data-photo');
        STATE.log.forEach(function(e){ if(e.id === pid2 && e.photo) photoView = e.photo; });
        if(photoView){ betView = ''; render(); }
        return;
      }
      var om = ev.target.closest('[data-open-match]');
      if(om){
        var mid = om.getAttribute('data-open-match');
        betView = '';
        STATE.log.forEach(function(e){ if(e.id === mid) openEdit(e); });
        return;
      }
      var ow = ev.target.closest('[data-owes]');
      if(ow && !readOnly){
        var parts = ow.getAttribute('data-owes').split(':');
        STATE.bets.forEach(function(x){ if(x.id === parts[0]) x.owedBy = parts[1]; });
        render(); save(); return;
      }
      var tg = ev.target.closest('[data-bet-toggle]');
      if(tg && !readOnly){
        var bid2 = tg.getAttribute('data-bet-toggle');
        STATE.bets.forEach(function(x){
          if(x.id === bid2){ x.done = !x.done; if(x.done) x.doneAt = new Date().toISOString(); else delete x.doneAt; }
        });
        render(); save(); return;
      }
      if(onScrim || ev.target.closest('button[data-close-bet]')){ betView = ''; betEdit = false; render(); }
      return;
    }
    if(gameMenu){
      if(gameEdit){
        if(ev.target.closest('[data-game-save]')){ ev.preventDefault(); saveGameEdit(); return; }
        if(ev.target.closest('[data-game-cancel]')){ gameEdit = false; lockErr = ''; render(); return; }
        if(onScrim){ gameEdit = false; lockErr = ''; gameMenu = ''; render(); }
        return;
      }
      if(ev.target.closest('[data-game-edit]') && !readOnly){ gameEdit = true; lockErr = ''; render(); focusEnd('ge-rule'); return; }
      var swt = ev.target.closest('[data-sw-ties]');
      if(swt){
        var gid2 = swt.getAttribute('data-sw-ties');
        STATE.games.forEach(function(g){ if(g.id === gid2){ if(g.ties) delete g.ties; else g.ties = true; } });
        render(); save(); return;
      }
      var tie = ev.target.closest('[data-tie]');
      if(tie){
        var tg = tie.getAttribute('data-tie');
        gameMenu = '';
        openNew(tg, 't');
        return;
      }
      var rip = ev.target.closest('[data-kill]');
      if(rip){
        var kid = rip.getAttribute('data-kill');
        snapshot('Removed the ' + gameName(kid) + ' tile');
        STATE.games = STATE.games.filter(function(g){ return g.id !== kid; });
        gameMenu = '';
        render(); save(); return;
      }
      if(onScrim || ev.target.closest('button[data-close-game]')){ gameMenu = ''; render(); }
      return;
    }
    if(chooser){
      var pk = ev.target.closest('[data-pick-up]');
      if(pk){ STATE.nextUp = pk.getAttribute('data-pick-up'); chooser = false; render(); save(); return; }
      if(ev.target.closest('[data-auto-up]')){ clearOverride(); chooser = false; render(); save(); return; }
      if(onScrim || ev.target.closest('button[data-close-up]')){ chooser = false; render(); }
      return;
    }
    if(photoView){
      if(onScrim || ev.target.closest('button[data-close-photo]')){ photoView = ''; render(); }
      return;
    }
    if(draft){
      var swHit = ev.target.closest('[data-sw]');
      if(swHit){
        readSheet();
        var swK = swHit.getAttribute('data-sw');
        if(swK === 'date') draft.useDate = !draft.useDate;
        else if(swK === 'time') draft.useTime = !draft.useTime;
        else draft.useBet = !draft.useBet;
        render(); return;
      }
      if(ev.target.closest('[data-save-sheet]')){ commitSheet(); return; }
      if(ev.target.closest('[data-drop-photo]')){ readSheet(); draft.photo = ''; render(); return; }
      if(onScrim || ev.target.closest('button[data-close-sheet]')){ draft = null; render(); return; }
      return;   // everything else inside the sheet is a plain form control
    }
    var t = ev.target.closest('[data-game],[data-undo],[data-showall],[data-open-add],[data-cancel-add],[data-kill],[data-edit],[data-cancel-edit],[data-tab],[data-bet-toggle],[data-bet-del],[data-disconnect],[data-copy-link],[data-photo],[data-open-up],[data-bet-open],[data-ledger-toggle],[data-cal-toggle],[data-sync-toggle],[data-menu],[data-betgroup],[data-fmt],[data-pass-forget],[data-sort],[data-cal],[data-day]');
    if(!t) return;
    if(t.hasAttribute('data-open-up')){ chooser = true; render(); return; }
    if(t.hasAttribute('data-menu')){ gameMenu = t.getAttribute('data-menu'); gameEdit = false; lockErr = ''; render(); return; }
    if(t.hasAttribute('data-bet-open')){ betView = t.getAttribute('data-bet-open'); betEdit = false; lockErr = ''; render(); return; }
    if(t.hasAttribute('data-ledger-toggle')){ ledgerOpen = !ledgerOpen; render(); return; }
    if(t.hasAttribute('data-cal-toggle')){ calOpen = !calOpen; render(); return; }
    if(t.hasAttribute('data-sync-toggle')){ syncOpen = !syncOpen; render(); return; }
    if(t.hasAttribute('data-fmt')){
      hour24 = t.getAttribute('data-fmt') === '24';
      try{ window.localStorage.setItem(FMT_KEY, hour24 ? '24' : '12'); }catch(err){}
      render(); return;
    }
    if(t.hasAttribute('data-betgroup')){
      if(t.getAttribute('data-betgroup') === 'done') doneOpen = !doneOpen; else openOpen = !openOpen;
      render(); return;
    }
    if(t.hasAttribute('data-sort')){
      var sv = t.getAttribute('data-sort');
      if(sv !== ledgerSort){ ledgerSort = sv; showAll = false; render(); }
      return;
    }
    if(t.hasAttribute('data-cal')){ shiftMonth(t.getAttribute('data-cal') === 'next' ? 1 : -1); render(); return; }
    if(t.hasAttribute('data-day')){
      var dk = t.getAttribute('data-day');
      calDay = (calDay === dk) ? '' : dk;
      render();
      return;
    }
    if(t.hasAttribute('data-photo')){
      var pid = t.getAttribute('data-photo');
      STATE.log.forEach(function(e){ if(e.id === pid && e.photo) photoView = e.photo; });
      if(photoView) render();
      return;
    }
    if(t.hasAttribute('data-tab')){
      var v = t.getAttribute('data-tab');
      if(v !== view){ view = v; draft = null; chooser = false; betView = ''; betEdit = false; gameMenu = ''; adding = false; render(); window.scrollTo(0, 0); }
      return;
    }
    if(t.hasAttribute('data-copy-link')){
      var link = shareLink();
      var done = function(){ t.textContent = 'Copied'; setTimeout(function(){ t.textContent = 'Copy link'; }, 1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(link).then(done, function(){ t.textContent = 'Copy it by hand'; });
      } else {
        var f = document.getElementById('sy-link');
        if(f){ f.select(); done(); }
      }
      return;
    }
    if(t.hasAttribute('data-pass-forget')){ disconnectBoard(); locked = true; render(); return; }
    if(t.hasAttribute('data-disconnect')){ disconnectBoard(); return; }
    if(t.hasAttribute('data-showall')){ showAll = true; render(); return; }
    if(readOnly) return;
    if(t.hasAttribute('data-bet-toggle')){
      var bid = t.getAttribute('data-bet-toggle');
      STATE.bets.forEach(function(b){
        if(b.id === bid){ b.done = !b.done; if(b.done) b.doneAt = new Date().toISOString(); else delete b.doneAt; }
      });
      render(); save(); return;
    }
    if(t.hasAttribute('data-bet-del')){
      var did = t.getAttribute('data-bet-del');
      var gone = null;
      STATE.bets.forEach(function(x){ if(x.id === did) gone = x; });
      snapshot('Deleted the bet' + (gone ? ' \u201c' + gone.text + '\u201d' : ''));
      STATE.bets = STATE.bets.filter(function(b){ return b.id !== did; });
      render(); save(); return;
    }
    if(t.hasAttribute('data-open-add')){
      adding = true; render();
      var f = document.getElementById('add-name'); if(f) f.focus();
      return;
    }
    if(t.hasAttribute('data-cancel-add')){ adding = false; render(); return; }
    if(t.hasAttribute('data-edit')){
      var eid2 = t.getAttribute('data-edit');
      STATE.log.forEach(function(e){ if(e.id === eid2) openEdit(e); });
      return;
    }
    if(t.hasAttribute('data-kill')){
      var gid = t.getAttribute('data-kill');
      snapshot('Removed the ' + gameName(gid) + ' tile');
      STATE.games = STATE.games.filter(function(g){ return g.id !== gid; });
      render(); save(); return;
    }
    if(t.hasAttribute('data-undo')){
      var id = t.getAttribute('data-undo');
      var m = null;
      STATE.log.forEach(function(e){ if(e.id === id) m = e; });
      var tiedBet = betFor(id);
      snapshot(m ? ((m.winner === 't' ? 'Deleted the ' + gameName(m.game) + ' tie'
                     : 'Deleted ' + STATE.players[m.winner] + '\u2019s ' + gameName(m.game) + ' win')
                    + (tiedBet ? ' and its bet' : '')) : 'Deleted a match');
      STATE.log = STATE.log.filter(function(e){ return e.id !== id; });
      // a match's bet has nothing left to hang on, so it goes with it
      STATE.bets = STATE.bets.filter(function(x){ return x.matchId !== id; });
      render(); save(); return;
    }
    openNew(t.getAttribute('data-game'), t.getAttribute('data-w'));
  });

  render();
  if(mode === 'cloud'){
    setStatus('saving');
    pullCloud(true).then(startPolling);
  } else if(!localMode){
    getApi().then(function(a){ if(!a){ localMode = true; mode = 'local'; restoreLocal(); render(); } });
  }
}
APP();
</script>
</body>
</html>
